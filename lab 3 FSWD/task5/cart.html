<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Scentify</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a href="index.html"
           class="navbar-brand fw-bold">

            Scentify

        </a>


        <a href="index.html"
           class="btn btn-light">

            Continue Shopping

        </a>

    </div>

</nav>



<!-- CART -->

<div class="container py-5">


    <h1 class="fw-bold mb-4">

        Shopping Cart

    </h1>


    <div class="row g-4">


        <!-- CART ITEMS -->

        <div class="col-lg-8">


            <!-- ITEM 1 -->

            <div class="card mb-3 shadow-sm">

                <div class="card-body">

                    <div class="row align-items-center">


                        <div class="col-md-3">

                            <div class="cart-product-image">

                                S1

                            </div>

                        </div>


                        <div class="col-md-4">

                            <h5>
                                S1 By Qamar
                            </h5>

                            <p class="text-muted">

                                $49.99

                            </p>

                        </div>


                        <div class="col-md-3">


                            <label class="form-label">

                                Quantity

                            </label>


                            <select class="form-select">

                                <option>1</option>

                                <option selected>2</option>

                                <option>3</option>

                                <option>4</option>

                            </select>

                        </div>


                        <div class="col-md-2">

                            <a href="#"
                               class="btn btn-outline-danger mt-3">

                                Remove

                            </a>

                        </div>

                    </div>

                </div>

            </div>



            <!-- ITEM 2 -->

            <div class="card mb-3 shadow-sm">

                <div class="card-body">

                    <div class="row align-items-center">


                        <div class="col-md-3">

                            <div class="cart-product-image">

                                S2

                            </div>

                        </div>


                        <div class="col-md-4">

                            <h5>
                                S2 By Qamar
                            </h5>

                            <p class="text-muted">

                                $59.99

                            </p>

                        </div>


                        <div class="col-md-3">

                            <label class="form-label">

                                Quantity

                            </label>


                            <select class="form-select">

                                <option selected>1</option>

                                <option>2</option>

                                <option>3</option>

                                <option>4</option>

                            </select>

                        </div>


                        <div class="col-md-2">

                            <a href="#"
                               class="btn btn-outline-danger mt-3">

                                Remove

                            </a>

                        </div>

                    </div>

                </div>

            </div>


        </div>



        <!-- SUMMARY -->

        <div class="col-lg-4">


            <div class="card shadow-sm">

                <div class="card-body">


                    <h4 class="fw-bold">

                        Cart Summary

                    </h4>


                    <hr>


                    <div class="d-flex
                                justify-content-between">

                        <span>
                            S1 × 2
                        </span>

                        <span>
                            $99.98
                        </span>

                    </div>


                    <div class="d-flex
                                justify-content-between mt-2">

                        <span>
                            S2 × 1
                        </span>

                        <span>
                            $59.99
                        </span>

                    </div>


                    <hr>


                    <div class="d-flex
                                justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong>
                            $159.97
                        </strong>

                    </div>


                    <a href="checkout.html"
                       class="btn btn-dark w-100 mt-4">

                        Proceed to Checkout

                    </a>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>

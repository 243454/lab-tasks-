<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Scentify</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a href="index.html"
           class="navbar-brand fw-bold">

            Scentify

        </a>

    </div>

</nav>



<div class="container py-5">


    <h1 class="fw-bold mb-4">

        Checkout

    </h1>


    <div class="row g-4">


        <!-- BILLING FORM -->

        <div class="col-lg-7">


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <h4 class="fw-bold mb-4">

                        Billing Information

                    </h4>


                    <form>


                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>


                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">

                                Email Address

                            </label>


                            <input
                                type="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>


                            <input
                                type="tel"
                                class="form-control"
                                placeholder="Enter your phone number"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">

                                Delivery Address

                            </label>


                            <textarea
                                class="form-control"
                                rows="4"
                                placeholder="Enter your complete address"
                                required></textarea>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">

                                Payment Method

                            </label>


                            <select class="form-select">

                                <option>
                                    Cash on Delivery
                                </option>

                                <option>
                                    Credit Card
                                </option>

                                <option>
                                    Debit Card
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100">

                            Place Order

                        </button>

                    </form>

                </div>

            </div>

        </div>



        <!-- ORDER SUMMARY -->

        <div class="col-lg-5">


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <h4 class="fw-bold">

                        Order Summary

                    </h4>


                    <hr>


                    <div class="d-flex
                                justify-content-between mb-3">

                        <span>
                            S1 By Qamar × 2
                        </span>

                        <span>
                            $99.98
                        </span>

                    </div>


                    <div class="d-flex
                                justify-content-between mb-3">

                        <span>
                            S2 By Qamar × 1
                        </span>

                        <span>
                            $59.99
                        </span>

                    </div>


                    <hr>


                    <div class="d-flex
                                justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong>
                            $159.97
                        </strong>

                    </div>


                </div>

            </div>


        </div>

    </div>

</div>


</body>

</html>
